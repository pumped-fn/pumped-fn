name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Configure npm for OIDC trusted publishing
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "npm version: $(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm -F @pumped-fn/lite-react exec playwright install --with-deps chromium

      - name: Install Lightpanda browser
        run: |
          lightpanda_sha256=5713d49d06e8d4948d3358b6ce859ecca8e6f07dc312134d9f54999fb6e66c52
          curl -fsSL -o /tmp/lightpanda https://github.com/lightpanda-io/browser/releases/download/0.3.5/lightpanda-x86_64-linux
          echo "${lightpanda_sha256}  /tmp/lightpanda" | sha256sum --check --status
          chmod +x /tmp/lightpanda
          echo "LIGHTPANDA_EXECUTABLE_PATH=/tmp/lightpanda" >> "$GITHUB_ENV"

      - name: Check Lightpanda browser
        run: ${LIGHTPANDA_EXECUTABLE_PATH:-$HOME/.cache/lightpanda-node/lightpanda} version

      - name: Build packages
        run: pnpm -r build

      - name: Run tests
        timeout-minutes: 15
        run: pnpm -r --workspace-concurrency=2 test --passWithNoTests

      - name: Diagnose test failure
        if: failure()
        run: |
          nproc
          lscpu
          free -h
          ps -eo pid,ppid,stat,etime,%cpu,%mem,wchan:32,comm --sort=-%cpu

      - name: Run Lightpanda browser tests
        run: pnpm -F @pumped-fn/lite-react test:browser:lightpanda

      - name: Check published package shapes
        run: |
          pnpm published-types:check
          pnpm packed-lite:check

      - name: Generate release title
        id: release_title
        run: echo "title=$(bash scripts/get-release-title.sh)" >> $GITHUB_OUTPUT

      - name: Detect release work
        id: release_state
        shell: bash
        run: |
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

          subject=$(git log -1 --format=%s)
          if [[ "$subject" =~ ^chore:\ version\ packages(\ \(#[0-9]+\))?$ ]]; then
            echo "is_version_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_version_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect first publish for new package names
        if: steps.release_state.outputs.is_version_commit == 'true'
        id: first_publish
        shell: bash
        run: |
          missing_packages=()
          for package in \
            @pumped-fn/lite-logging \
            @pumped-fn/lite-logging-pino \
            @pumped-fn/lite-observability \
            @pumped-fn/lite-observability-otel
          do
            if response=$(npm view "$package" version --json 2>&1); then
              continue
            fi

            if [[ "$response" == *E404* ]]; then
              missing_packages+=("$package")
              continue
            fi

            echo "::error title=npm package lookup failed::$package could not be checked"
            printf '%s\n' "$response" >&2
            exit 1
          done

          if (( ${#missing_packages[@]} > 0 )); then
            required=true
          else
            required=false
          fi

          echo "required=$required" >> "$GITHUB_OUTPUT"
          {
            echo 'packages<<EOF'
            printf '%s\n' "${missing_packages[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Configure token for first publish
        if: steps.first_publish.outputs.required == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::NPM_TOKEN is required to create new npm package names"
            exit 1
          fi
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"

      - name: Create Release Pull Request or Publish
        if: "${{ steps.release_state.outputs.has_changesets == 'true' || steps.release_state.outputs.is_version_commit == 'true' }}"
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          publish: pnpm changeset:publish
          version: pnpm changeset version
          commit: 'chore: version packages'
          title: '${{ steps.release_title.outputs.title }}'
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Remove first-publish token
        if: ${{ always() && steps.first_publish.outputs.required == 'true' }}
        run: npm config delete //registry.npmjs.org/:_authToken

      - name: Record trusted-publisher follow-up
        if: ${{ always() && steps.first_publish.outputs.required == 'true' }}
        env:
          BOOTSTRAP_PACKAGES: ${{ steps.first_publish.outputs.packages }}
        run: |
          {
            echo "### Set npm trusted publishers before the next release"
            echo
            echo 'These names were missing before this publish attempt.'
            echo 'Run each command after its package exists, using npm 11.15+ and an npm account with 2FA.'
            echo 'If publishing stopped early, rerun the release first.'
            echo
            echo '```bash'
            while IFS= read -r package; do
              if [[ -n "$package" ]]; then
                echo "npm trust github $package --file release.yml --repo pumped-fn/pumped-fn --allow-publish"
              fi
            done <<< "$BOOTSTRAP_PACKAGES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish notification
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "🎉 Published packages:"
          echo "${{ steps.changesets.outputs.publishedPackages }}"

      - name: Verify published registry metadata
        if: steps.changesets.outputs.published == 'true'
        timeout-minutes: 5
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node --input-type=module <<'NODE'
          import { execFile } from 'node:child_process'
          import { promisify } from 'node:util'
          import { setTimeout as delay } from 'node:timers/promises'

          const run = promisify(execFile)
          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES)
          const waitForVersion = async ({ name, version }) => {
            const target = `${name}@${version}`
            const deadline = Date.now() + 120_000
            let reason = 'no attempt completed'
            while (Date.now() < deadline) {
              try {
                const { stdout } = await run('npm', ['view', target, 'version', '--json'], { timeout: 20_000 })
                if (JSON.parse(stdout) === version) return
                reason = `registry reported ${stdout.trim()}`
              } catch (error) {
                reason = String(error.stderr || error.message).trim()
              }
              await delay(2_000)
            }
            throw new Error(`${target} is not visible in the npm registry: ${reason}`)
          }
          await Promise.all(packages.map(waitForVersion))
          NODE
